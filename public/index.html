      const examples = [1, 2, 3, 4, 5];

      async function all(query) {
        const {columns, values} = await db.exec(query)[0];
        return values.map((row) => {
          let obj = {};
          // for (const )
          for (let x=0; x<row.length; x++) {
            obj[columns[x]] = row[x];
          }

          return obj;
          // row.map((value, index) => obj[columns[index] = value)
          // ['go'].map((v, i) => {console.log("v", v, "i", i)});

        });
        // console.log(columns, values);
      }

      function formatTime(time) {
        return Math.round(time / 1000) + "ms";
      }

      (async () => {
        const sqlPromise = initSqlJs({
          locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/${file}`
        });

        const dataPromise = fetch("/database.db").then(res => res.arrayBuffer());
        const [SQL, buf] = await Promise.all([sqlPromise, dataPromise])
        window.db = new SQL.Database(new Uint8Array(buf));

        
        const queryParts = [];
        queryParts.push(`SELECT language, name,`);

        for (const example of examples) {
          queryParts.push(
            `sum(case when example_id='${example}' then self_duration else 0 end) as self_example_${example},
             sum(case when example_id='${example}' then node_duration else 0 end) as node_example_${example},`
          );
        }

        queryParts.push(
          `avg(self_duration) as avg_self_duration,
          avg(node_duration) as avg_node_duration
          FROM implementations
          INNER JOIN executions ON (implementations.id=executions.implementation_id)
          GROUP BY implementations.id
          ORDER BY avg_node_duration ASC`
        );

        const query = queryParts.join('');
        console.log(query);

        const response = await all(query);

        // var c = a.map(function(e, i) {
        //   return [e, b[i]];
        // });

        function toRow(row) {
          let html = '<tr>' +
            '<th>' + row['language'] + 
            '<th>' + row['name'] + 
            '<td>' + formatTime(row['avg_self_duration']) +
            '<td>' + formatTime(row['avg_node_duration']);

          return html + examples.map((example) => {
            // console.log(row, example, );
            return `
              <td>${row['self_example_' + example] !== 0 ? formatTime(row['self_example_' + example]) : '-'}
              <td>${row['node_example_' + example] !== 0 ? formatTime(row['node_example_' + example]) : '-'}
            `;
          }).join("");
        }

        let html = '<table>' + 
          '<thead><tr><th>Language<th>Name<th>Average Self Duration<th>Average Node Duration';

        html += examples.map((example) => {
          return `<th>Self Duration ${example}<th>Node Duration ${example}`
        }).join("");
          // '<tbody>';

        const right = response.filter((value) => value.result);
        const wrong = response.filter((value) => !value.result);

        for (const row of right) {
          html += toRow(row);
        }

        html += "<tbody>";

        for (const row of wrong) {
          html += toRow(row);
        }


        // const table = document.createElement("table");
        
        document.getElementById("container").innerHTML = html;

      })();
